[workspace]
resolver = "2"
members = [
    "contracts/*",
]

[workspace.dependencies]
soroban-sdk = { version = "22.0.0" }

# Unused-dependency hygiene (issue #1569): CI runs `cargo machete` against this
# workspace and fails the build when a dependency declared in any member's
# Cargo.toml is not actually referenced by that crate's source. Keep this
# workspace free of unused dependencies; if a dependency is only needed for
# tests/benches, declare it under `[dev-dependencies]` so machete recognizes
# the usage.

[profile.release]
opt-level = "z"
# LOAD-BEARING: several contracts perform raw (non-`checked_`/non-`saturating_`)
# integer arithmetic on counters that are trusted not to silently wrap around
# in production. This is only safe because `overflow-checks = true` here
# forces those additions/subtractions to panic on overflow/underflow instead
# of wrapping, even though it is NOT the Soroban WASM release default.
#
# Contracts that rely on this today:
#   - contracts/platform_stats/src/lib.rs: `prev + 1` (TotalMerchants),
#     `tp + 1` (TotalPayments) and `count + 1` (rolling 24h ActiveBucket)
#   - contracts/rbac_access/src/lib.rs: `count - 1` in `revoke_role`
#     (SuperAdminCount)
#
# Do NOT remove or flip this flag (e.g. to shrink WASM size or speed up
# builds) without first migrating the above call sites to explicit
# `checked_add`/`checked_sub`/`saturating_*` arithmetic — otherwise these
# counters can wrap silently with no compiler warning and no existing test
# would catch it.
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
# Reproducible builds (issue #1567): force a deterministic, absolute-path-free
# build so the same source produces the same WASM hash on every machine/CI
# agent. `trim-paths` strips machine-specific paths from the binary and
# `incremental = false` avoids non-deterministic incremental artifacts.
trim-paths = "all"
incremental = false

# wasm-opt optimization level (issue #1568): the Makefile post-processes the
# release WASM with `wasm-opt -Oz` (size-optimized). This is a deliberate
# tradeoff — `-Oz` minimizes deployed bytecode size (lower upload/storage
# cost and comfortably under the Soroban WASM size limit) at the cost of a
# small increase in per-invocation execution cost versus `-O3`. Benchmarks
# comparing contract execution cost for `-Oz` vs `-O3` are emitted by the
# Makefile `bench-wasm-opt` target and summarized in the README. Keep this
# profile aligned with the level chosen there; do not switch to `-O3`
# without re-running the benchmark and updating the README rationale.

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
