[package]
name = "liquidity-router"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
slippage-protection = { path = "../slippage_protection" }
merchant-registry = { path = "../merchant_registry" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
