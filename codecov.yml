    - component_id: liquidity_router
      name: liquidity_router
      paths:
        - dupdapp_contract/contracts/liquidity_router/**
    - component_id: merchant_registry
      name: merchant_registry
      paths:
        - dupdapp_contract/contracts/merchant_registry/**
    - component_id: multisig_admin
      name: multisig_admin
      paths:
        - dupdapp_contract/contracts/multisig_admin/**
    - component_id: payment_escrow
      name: payment_escrow
      paths:
        - dupdapp_contract/contracts/payment_escrow/**
    - component_id: payment_request
      name: payment_request
      paths:
        - dupdapp_contract/contracts/payment_request/**
    - component_id: rbac_access
