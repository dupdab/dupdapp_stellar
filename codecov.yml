# Codecov configuration — enforce per-contract coverage thresholds.
#
# Each contract under dupdapp_contract/contracts/* is treated as its own
# component with an 80% coverage target. A PR fails if any contract's
# coverage drops below that threshold.

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 0%
        base: auto
        informational: false
    patch:
      default:
        target: 80%
        threshold: 0%
        base: auto
        informational: false

# Exclude test files and generated snapshots from coverage calculation.
ignore:
  - "**/src/test.rs"
  - "**/test_snapshots/**"
  - "**/tests/**"
  - "**/*_test.rs"

# Per-contract components. Each contract is its own component with an 80%
# target so a single under-covered contract fails the PR status check.
component_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
        threshold: 0%
        informational: false
  individual_components:
    - component_id: admin_timelock
      name: admin_timelock
      paths:
        - dupdapp_contract/contracts/admin_timelock/**
    - component_id: batch_payments
      name: batch_payments
      paths:
        - dupdapp_contract/contracts/batch_payments/**
    - component_id: fee_calculator
      name: fee_calculator
      paths:
        - dupdapp_contract/contracts/fee_calculator/**
    - component_id: fee_distributor
      name: fee_distributor
      paths:
