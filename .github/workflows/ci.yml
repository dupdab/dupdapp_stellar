name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  LLVM_PROFILE_FILE: target/coverage/dabdub-%p-%m.profraw

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Install Rust wasm target
        run: rustup target add wasm32v1-none

      # The cargo workspace lives in dabdub_contracts/; there is no manifest at
      # the repository root, so every cargo invocation has to run from there.
      - name: cargo test
        working-directory: dabdub_contracts
        run: cargo test

      - name: Generate coverage report
        working-directory: dabdub_contracts
        run: |
          mkdir -p target/coverage
          cargo tarpaulin \
            --workspace \
            --out Xml \
            --output-dir target/coverage \
            --exclude-files "*/tests/*" \
            --verbose \
            --fail-under 85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: dabdub_contracts/target/coverage/cobertura.xml
          flags: rust
          name: dabdub-contracts
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # `make check-wasm-size` depends on `make build-optimised`, which shells
      # out to wasm-opt. Installed the same way deploy.yml does it.
      - name: Install wasm-opt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binaryen

      # Builds every workspace contract to wasm, runs wasm-opt -Oz over the
      # output, and fails when any contract exceeds the 64 KB Soroban deploy
      # limit. deploy.yml already gates this on `main`; running it here means a
      # pull request that grows a contract past the limit is caught before it
      # merges rather than after.
      - name: Build WASM and check size budget
        run: make check-wasm-size

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: dabdub_contracts/target/wasm32v1-none/release/*.wasm
          retention-days: 30

      # Install the Stellar CLI so we can auto-generate TypeScript bindings
      # from the freshly built contract WASM instead of hand-maintaining them.
      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | bash -s -- --version 22.0.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Generate TypeScript bindings for every built contract. Output lands in
      # bindings/<contract-name>/ so it can be published and consumed by the
      # NestJS backend.
      - name: Generate contract TypeScript bindings
        run: |
          mkdir -p bindings
          for wasm in dabdub_contracts/target/wasm32v1-none/release/*.wasm; do
            name="$(basename "$wasm" .wasm)"
            echo "Generating bindings for $name"
            stellar contract bindings typescript \
              --wasm "$wasm" \
              --output-dir "bindings/$name" \
              --overwrite
          done

      - name: Upload generated bindings
        uses: actions/upload-artifact@v4
        with:
          name: contract-bindings
          path: bindings/
          retention-days: 30

      # On merge to main, publish the generated bindings as a GitHub release
      # asset so the backend can consume the auto-generated types.
      - name: Publish bindings as release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="bindings-${GITHUB_SHA::12}"
          tar -czf "contract-bindings-${GITHUB_SHA::12}.tar.gz" -C bindings .
          gh release create "$tag" \
            "contract-bindings-${GITHUB_SHA::12}.tar.gz" \
            --title "Contract bindings ${GITHUB_SHA::12}" \
            --notes "Auto-generated TypeScript bindings from commit ${GITHUB_SHA}."
