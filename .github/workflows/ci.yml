name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  LLVM_PROFILE_FILE: target/coverage/dabdub-%p-%m.profraw

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Install Rust wasm target
        run: rustup target add wasm32v1-none

      # The cargo workspace lives in dabdub_contracts/; there is no manifest at
      # the repository root, so every cargo invocation has to run from there.
      - name: cargo test
        working-directory: dabdub_contracts
        run: cargo test

      - name: Generate coverage report
        working-directory: dabdub_contracts
        run: |
          mkdir -p target/coverage
          cargo tarpaulin \
            --workspace \
            --out Xml \
            --output-dir target/coverage \
            --exclude-files "*/tests/*" \
            --verbose \
            --fail-under 85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: dabdub_contracts/target/coverage/cobertura.xml
          flags: rust
          name: dabdub-contracts
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # `make check-wasm-size` depends on `make build-optimised`, which shells
      # out to wasm-opt. Installed the same way deploy.yml does it.
      - name: Install wasm-opt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binaryen

      # Builds every workspace contract to wasm, runs wasm-opt -Oz over the
      # output, and fails when any contract exceeds the 64 KB Soroban deploy
      # limit. deploy.yml already gates this on `main`; running it here means a
      # pull request that grows a contract past the limit is caught before it
      # merges rather than after.
      - name: Build WASM and check size budget
        run: make check-wasm-size

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: dabdub_contracts/target/wasm32v1-none/release/*.wasm
          retention-days: 30

      # Generates TypeScript bindings for every contract from the freshly built
      # wasm so the backend can import auto-generated types instead of
      # hand-written ones. Runs after the build step above.
      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | bash -s -- --version 22.0.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Generate contract bindings
        run: |
          set -euo pipefail
          mkdir -p bindings
          for contract in admin_auth admin_timelock batch_payments fee_calculator fee_distributor liquidity_router; do
            wasm="dabdub_contracts/target/wasm32v1-none/release/${contract}.wasm"
            if [ ! -f "$wasm" ]; then
              echo "::error::Missing wasm for $contract at $wasm"
              exit 1
            fi
            stellar contract bindings typescript \
              --wasm "$wasm" \
              --output-dir "bindings/$contract" \
              --overwrite
          done

      - name: Upload contract bindings
        uses: actions/upload-artifact@v4
        with:
          name: contract-bindings
          path: bindings/
          retention-days: 30

      # Regenerated on every merge to main and published as a GitHub release
      # asset so downstream consumers can pull the latest bindings.
      - name: Publish contract bindings release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="bindings-${GITHUB_SHA::12}"
          tar -czf contract-bindings.tar.gz -C bindings .
          gh release create "$tag" contract-bindings.tar.gz \
            --title "Contract bindings $tag" \
            --notes "Auto-generated TypeScript bindings for commit $GITHUB_SHA."
