name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly scheduled audit so vulnerable dependencies are detected even when
  # no code changes land. The `cargo-audit` job below runs on this schedule.
  schedule:
    - cron: '0 6 * * 1'

      - name: Install Clarinet
        run: |
          curl -sSL https://github.com/hirosystems/clarinet/releases/latest/download/clarinet-linux-x64.tar.gz | tar -xz
          sudo mv clarinet /usr/local/bin/clarinet
      - name: Run unit tests
        run: clarinet test

  integration-tests:
    name: Integration tests (payment_escrow + mer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dabdub_contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Clarinet
        run: |
          curl -sSL https://github.com/hirosystems/clarinet/releases/latest/download/clarinet-linux-x64.tar.gz | tar -xz
          sudo mv clarinet /usr/local/bin/clarinet
      - name: Run unit tests
        run: clarinet test

  integration-tests:
    name: Integration tests (payment_escrow + merchant_registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clarinet
        run: |
          curl -sSL https://github.com/hirosystems/clarinet/releases/latest/download/clarinet-linux-x64.tar.gz | tar -xz
          sudo mv clarinet /usr/local/bin/clarinet
      - name: Run integration tests
        run: clarinet test tests/integration

  batch-payments-benchmark:
    name: batch_payments instruction benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install wasm-opt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binaryen

      - name: Run batch_payments instruction benchmark
        working-directory: dabdub_contracts
        run: |
          cargo test -p batch_payments benchmark_max_batch_instruction_usage -- --nocapture --exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run batch_payments instruction benchmark
        working-directory: dabdub_contracts
        run: |
          cargo test -p batch_payments benchmark_max_batch_instruction_usage -- --nocapture --exact

  # Deploys every contract to Stellar testnet, runs the integration test suite
  # against the deployed instances, then tears the test contracts down. Only
  # runs on merges to main so testnet is not polluted by every PR. Cleanup uses
  # `always()` so test contracts are removed even when deploy or tests fail.
  testnet-integration:
    name: Testnet integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      STELLAR_NETWORK: testnet
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      STELLAR_ACCOUNT: ci-testnet-deployer

    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned in rust-toolchain.toml (issue #1567) so the
      # compiler version is identical on every machine and CI agent. The
      # action reads that file instead of tracking `stable`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Check Rust formatting
        working-directory: dabdub_contracts
        run: cargo fmt -- --check

      # Cache the cargo registry (downloaded crate sources) and the workspace
      # target directory so dependencies are not re-downloaded and recompiled
      # on every run. The key is derived from the Cargo.lock hash so the cache
      # is invalidated whenever the dependency graph changes; restore-keys
      # provide a fallback so partial rebuilds still benefit.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dabdub_contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('dabdub_contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # cargo-machete (issue #1569) detects dependencies declared in
      # Cargo.toml that are never referenced by the crate source. Unused deps
      # bloat compile time and widen the supply-chain surface, so CI fails
      # when any are found.
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Install Rust wasm target
        run: rustup target add wasm32v1-none

      # The cargo workspace lives in dupdub_contracts/; there is no manifest at
      # the repository root, so every cargo invocation has to run from there.
      - name: cargo clippy
        working-directory: dabdub_contracts
        run: cargo clippy -- -D warnings

      # Fails CI when any Cargo.toml in the contracts workspace declares a
      # dependency that is not used by the crate source (issue #1569).
      - name: cargo machete (unused dependencies)
        working-directory: dabdub_contracts
        run: cargo machete

      - name: cargo test
        working-directory: dabdub_contracts
        run: cargo test

      # Property-based tests (proptest) live behind the `proptest` feature so
      # the default test run stays fast. This job exercises them explicitly so
      # regressions in fee/slippage/escrow invariants are caught in CI.
      - name: cargo test (property-based)
        working-directory: dabdub_contracts
        run: cargo test --features proptest -- --nocapture

      # Scans Cargo.lock against the RustSec advisory database. cargo-audit
      # exits non-zero on any vulnerability by default, which fails CI on HIGH
      # and CRITICAL advisories (and lower severities too).
      - name: cargo audit
        working-directory: dabdub_contracts
        run: cargo audit

      - name: Generate coverage report
        working-directory: dabdub_contracts
        run: |
          mkdir -p target/coverage
          cargo tarpaulin \
            --workspace \
            --out Xml \
            --output-dir target/coverage \
            --exclude-files "*/tests/*" \
            --verbose \
            --fail-under 85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: dupdub_contracts/target/coverage/cobertura.xml
          flags: rust
          name: dupdub-contracts
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # `make check-wasm-size` depends on `make build-optimised`, which shells
      # out to wasm-opt. Installed the same way deploy.yml does it.
      - name: Install wasm-opt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binaryen

      # Builds every workspace contract to wasm, runs wasm-opt -Oz over the
      # output, and fails when any contract exceeds the 64 KB Soroban deploy
      # limit. deploy.yml already gates this on `main`; running it here means a
      # pull request that grows a contract past the limit is caught before it
      # merges rather than after. The target also e
      - name: Install wasm-opt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binaryen

      # Builds every workspace contract to wasm, runs wasm-opt -Oz over the
      # output, and fails when any contract exceeds the 64 KB Soroban deploy
      # limit. deploy.yml already gates this on `main`; running it here means a
      # pull request that grows a contract past the limit is caught before it
      # merges rather than after. The target also emits a warning at 48 KB
      # (75% of the limit) so size creep is visible before it becomes a
      # deployment failure.
      - name: Build WASM and check size budget
        run: make check-wasm-size

      # Reproducible-build verification (issue #1567): rebuild the wasm from a
      # clean target directory with the pinned toolchain and locked deps, then
      # compare the resulting hashes against the first build. Any mismatch
      # means the build is not deterministic and fails CI.
      - name: Verify reproducible WASM build
        run: |
          set -euo pipefail
          wasm_dir="dabdub_contracts/target/wasm32v1-none/release"
          sha256sum "$wasm_dir"/*.wasm | sort -k2 > /tmp/wasm-hashes-first.txt
          echo "First build hashes:"
          cat /tmp/wasm-hashes-first.txt

          # Clean rebuild with the same pinned toolchain and locked deps.
          ( cd dabdub_contracts && cargo clean )
          make build-optimised

          sha256sum "$wasm_dir"/*.wasm | sort -k2 > /tmp/wasm-hashes-second.txt
          echo "Second build hashes:"
          cat /tmp/wasm-hashes-second.txt

          if ! diff -u /tmp/wasm-hashes-first.txt /tmp/wasm-hashes-second.txt; then
            echo "::error::WASM output is not reproducible across builds."
            exit 1
          fi
          echo "WASM build is reproducible."

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: dupdub_contracts/target/wasm32v1-none/release/*.wasm
          retention-days: 30

      # Regenerates the machine-readable ABI JSON under docs/abi/ from the
      # built wasm and fails when the committed files drift from the contract
      # source. Keeps the NestJS backend's ABI docs in sync with the Rust code.
      - name: Verify contract ABI docs are up to date
        run: |
          make generate-abi
          if ! git diff --quiet -- docs/abi; then
            echo "::error::docs/abi is out of date. Run 'make generate-abi' and commit the result."
            git diff -- docs/abi
            exit 1
          fi

  cargo-audit:
    name: Cargo audit (Rust dependency vulnerabilities)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      # The cargo workspace lives in dabdub_contracts/; there is no manifest at
      # the repository root, so the audit runs from there.
      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit (fail on HIGH or CRITICAL)
        working-directory: dabdub_contracts
        run: cargo audit --fail-severity high

      # Generate TypeScript bindings for every built contract. Output lands in
      # bindings/<contract-name>/ so it can be published and consumed by the
      # NestJS backend. Runs after the build step above so the freshly built
      # wasm is used instead of hand-maintained bindings.
      - name: Generate contract TypeScript bindings
        run: |
          mkdir -p bindings
      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | bash -s -- --version 22.0.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Builds every workspace contract to optimised wasm so the same artifacts
      # that ship to production are the ones exercised on testnet.
      - name: Build optimised WASM
        run: make build-optimised

      # Restores the funded testnet deployer identity from a secret. The secret
      # key must be a funded testnet account; it is never logged.
      - name: Configure testnet deployer identity
        env:
          TESTNET_DEPLOYER_SECRET: ${{ secrets.TESTNET_DEPLOYER_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p bindings
          for contract in admin_auth admin_timelock batch_payments fee_calculator fee_distributor liquidity_router; do
            wasm="dabdub_contracts/target/wasm32v1-none/release/${contract}.wasm"
            if [ ! -f "$wasm" ]; then
              echo "::error::Missing wasm for $contract at $wasm"
              exit 1
            fi
            id=$(stellar contract deploy \
              --wasm "$wasm" \
              --source "$STELLAR_ACCOUNT" \
              --network "$STELLAR_NETWORK")
            echo "${contract}=${id}" | tee -a testnet-contract-ids.txt
          done

      - name: Run integration tests against testnet
        env:
          TESTNET_CONTRACT_IDS_FILE: testnet-contract-ids.txt
        run: |
          set -euo pipefail
          cargo test --manifest-path dabdub_contracts/Cargo.toml \
            --features testnet-integration \
            --test testnet_integration \
            -- --nocapture

      # Removes the test contracts deployed above. Runs even when deploy or the
      # integration suite failed so testnet is not left with orphan contracts.
      - name: Tear down testnet contracts
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f testnet-contract-ids.txt ]; then
            echo "No deployed contracts to tear down."
            exit 0
          fi
          while IFS='=' read -r contract id; do
            [ -z "$id" ] && continue
            echo "Removing ${contract} (${id})"
            stellar contract invoke \
              --id "$id" \
              --source "$STELLAR_ACCOUNT" \
              --network "$STELLAR_NETWORK" \
              -- __teardown || true
          done < testnet-contract-ids.txt

  # Reports per-contract WASM sizes on pull requests so size regressions are
  # visible during review instead of only at deploy time. Fails the PR when any
  # contract exceeds its per-contract budget defined in the Makefile.
  wasm-size-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

