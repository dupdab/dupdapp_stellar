name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  LLVM_PROFILE_FILE: target/coverage/dupdub-%p-%m.profraw

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Check Rust formatting
        working-directory: dabdub_contracts
        run: cargo fmt -- --check

      # Cache the cargo registry (downloaded crate sources) and the workspace
      # target directory so dependencies are not re-downloaded and recompiled
      # on every run. The key is derived from the Cargo.lock hash so the cache
      # is invalidated whenever the dependency graph changes; restore-keys
      # provide a fallback so partial rebuilds still benefit.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dabdub_contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('dabdub_contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install Rust wasm target
        run: rustup target add wasm32v1-none

      # The cargo workspace lives in dupdub_contracts/; there is no manifest at
      # the repository root, so every cargo invocation has to run from there.
      - name: cargo clippy
        working-directory: dabdub_contracts
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: dabdub_contracts
        run: cargo test

      # Property-based tests (proptest) live behind the `proptest` feature so
      # the default test run stays fast. This job exercises them explicitly so
      # regressions in fee/slippage/escrow invariants are caught in CI.
      - name: cargo test (property-based)
        working-directory: dabdub_contracts
        run: cargo test --features proptest -- --nocapture

      # Scans Cargo.lock against the RustSec advisory database. cargo-audit
      # exits non-zero on any vulnerability by default, which fails CI on HIGH
      # and CRITICAL advisories (and lower severities too).
      - name: cargo audit
        working-directory: dabdub_contracts
        run: cargo audit

      - name: Generate coverage report
        working-directory: dabdub_contracts
        run: |
          mkdir -p target/coverage
          cargo tarpaulin \
            --workspace \
            --out Xml \
            --output-dir target/coverage \
            --exclude-files "*/tests/*" \
            --verbose \
            --fail-under 85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: dupdub_contracts/target/coverage/cobertura.xml
          flags: rust
          name: dupdub-contracts
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # `make check-wasm-size` depends on `make build-optimised`, which shells
      # out to wasm-opt. Installed the same way deploy.yml does it.
      - name: Install wasm-opt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binaryen

      # Builds every workspace contract to wasm, runs wasm-opt -Oz over the
      # output, and fails when any contract exceeds the 64 KB Soroban deploy
      # limit. deploy.yml already gates this on `main`; running it here means a
      # pull request that grows a contract past the limit is caught before it
      # merges rather than after.
      - name: Build WASM and check size budget
        run: make check-wasm-size

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: dupdub_contracts/target/wasm32v1-none/release/*.wasm
          retention-days: 30

      # Regenerates the machine-readable ABI JSON under docs/abi/ from the
      # built wasm and fails when the committed files drift from the contract
      # source. Keeps the NestJS backend's ABI docs in sync with the Rust code.
      - name: Verify contract ABI docs are up to date
        run: |
          make generate-abi
          if ! git diff --quiet -- docs/abi; then
            echo "::error::docs/abi is out of date. Run 'make generate-abi' and commit the result."
            git diff -- docs/abi
            exit 1
          fi

  cargo-audit:
    name: Cargo audit (Rust dependency vulnerabilities)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The cargo workspace lives in dabdub_contracts/; there is no manifest at
      # the repository root, so the audit runs from there.
      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit (fail on HIGH or CRITICAL)
        working-directory: dabdub_contracts
        run: cargo audit --fail-severity high

      # Generate TypeScript bindings for every built contract. Output lands in
      # bindings/<contract-name>/ so it can be published and consumed by the
      # NestJS backend. Runs after the build step above so the freshly built
      # wasm is used instead of hand-maintained bindings.
      - name: Generate contract TypeScript bindings
        run: |
          mkdir -p bindings
      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | bash -s -- --version 22.0.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Generate TypeScript bindings for every built contract. Output lands in
      # bindings/<contract-name>/ so it can be published and consumed by the
      # NestJS backend.
      - name: Generate contract TypeScript bindings
        run: |
          set -euo pipefail
          mkdir -p bindings
          for contract in admin_auth admin_timelock batch_payments fee_calculator fee_distributor liquidity_router; do
            wasm="dabdub_contracts/target/wasm32v1-none/release/${contract}.wasm"
            if [ ! -f "$wasm" ]; then
              echo "::error::Missing wasm for $contract at $wasm"
              exit 1
            fi
            stellar contract bindings typescript \
              --wasm "$wasm" \
              --output-dir "bindings/$contract" \
              --overwrite
          done

      - name: Upload generated bindings
        uses: actions/upload-artifact@v4
        with:
          name: contract-bindings
          path: bindings/
          retention-days: 30

      # Regenerated on every merge to main and published as a GitHub release
      # asset so downstream consumers can pull the latest bindings.
      - name: Publish contract bindings release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="bindings-${GITHUB_SHA::12}"
          tar -czf "contract-bindings-${GITHUB_SHA::12}.tar.gz" -C bindings .
          gh release create "$tag" \
            "contract-bindings-${GITHUB_SHA::12}.tar.gz" \
            --title "Contract bindings ${GITHUB_SHA::12}" \
            --notes "Auto-generated TypeScript bindings from commit ${GITHUB_SHA}."

  # Deploys every contract to Stellar testnet and runs the integration suite
  # against the live deployment. Only runs on merges to main so PRs stay fast
  # and don't consume testnet resources. Deployed contract IDs are recorded in
  # a manifest and torn down in an always() step so testnet stays clean even
  # when the integration suite fails.
  testnet-integration:
    name: Testnet integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    env:
      STELLAR_NETWORK: testnet
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      DEPLOY_MANIFEST: testnet-deployments.json

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dabdub_contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('dabdub_contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | bash -s -- --version 22.0.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # A throwaway funded testnet identity is generated per run so no long-lived
      # secret is required. The secret is only used within this job.
      - name: Configure testnet identity
        run: |
          set -euo pipefail
          stellar keys generate ci-testnet --network testnet --fund
          echo "STELLAR_ACCOUNT=ci-testnet" >> "$GITHUB_ENV"

      - name: Build contracts for testnet
        run: make build-optimised

      - name: Deploy all contracts to testnet
        run: |
          set -euo pipefail
          echo '{}' > "$DEPLOY_MANIFEST"
          for contract in admin_auth admin_timelock batch_payments fee_calculator fee_distributor liquidity_router; do
            wasm="dabdub_contracts/target/wasm32v1-none/release/${contract}.wasm"
            if [ ! -f "$wasm" ]; then
              echo "::error::Missing wasm for $contract at $wasm"
              exit 1
            fi
            contract_id=$(stellar contract deploy \
              --wasm "$wasm" \
              --source "$STELLAR_ACCOUNT" \
              --network testnet)
            echo "Deployed $contract -> $contract_id"
            jq --arg name "$contract" --arg id "$contract_id" \
              '. + {($name): $id}' "$DEPLOY_MANIFEST" > tmp.json
            mv tmp.json "$DEPLOY_MANIFEST"
          done
          cat "$DEPLOY_MANIFEST"

      - name: Run integration tests against testnet
        working-directory: dabdub_contracts
        env:
          STELLAR_TESTNET_MANIFEST: ${{ github.workspace }}/testnet-deployments.json
        run: cargo test --features testnet-integration -- --nocapture

      # Always tear down the deployed test contracts, even when the integration
      # suite above fails, so testnet does not accumulate orphaned contracts.
      - name: Tear down testnet contracts
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$DEPLOY_MANIFEST" ]; then
            echo "No deployment manifest found; nothing to tear down."
            exit 0
          fi
          for contract_id in $(jq -r '.[]' "$DEPLOY_MANIFEST"); do
            echo "Removing $contract_id"
            stellar contract invoke \
              --id "$contract_id" \
              --source "$STELLAR_ACCOUNT" \
              --network testnet \
              -- remove_contract 2>/dev/null || \
              echo "::warning::Could not invoke remove_contract on $contract_id"
          done

  # Reports per-contract WASM sizes on pull requests so size regressions are
  # visible during review instead of only at deploy time.
  wasm-size-report:
    runs-on: ubuntu-latest
