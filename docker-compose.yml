services:
  stellar:
    image: stellar/quickstart:latest
    container_name: dabdub-local-testnet
    command: --local --enable-soroban-rpc
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/soroban/rpc", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - stellar-data:/opt/stellar

  stellar-quickstart:
    image: stellar/quickstart:latest
    ports:
      - "8000:8000"
    environment:
      - NETWORK=local
      - ENABLE_SOROBAN_RPC=true
    volumes:
      - stellar-quickstart-data:/opt/stellar
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/soroban/rpc"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  stellar-data:
  grafana-data:
  stellar-quickstart-data:
